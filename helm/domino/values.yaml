# Default values for installing Domino in a K8s cluster

git_access_token_pieces: default-substitute-this-for-your-own-token
git_access_token_workflows: default-substitute-this-for-your-own-token

# Container image registry — all Domino images are pulled from this registry.
# Override to use a mirror or a self-hosted registry (e.g. registry.gitlab.com/myorg).
# Matches the REGISTRY_NAME / CONTAINER_REGISTRY_* env var convention used elsewhere.
images:
  registry: gitlab.spice-platform.eu:5050

# Frontend service
frontend:
  enabled: true
  image:
    repository: domino-frontend
    tag: k8s
  deployMode: prod
  apiUrl: http://localhost/api
  baseName: /

# REST service
rest:
  enabled: true
  image:
    repository: domino-rest
    tag: latest
  deployMode: prod
  # Workflows git repository — namespace/repo path (DOMINO_GIT_WORKFLOWS_REPOSITORY)
  workflowsRepository: ~
  createDefaultUser: true
  rootPath: /api
  # Git provider for the workflows repository: github | gitlab | generic
  # Maps to DOMINO_GIT_PROVIDER env var.
  gitProvider: gitlab
  # Base URL for self-hosted GitLab (DOMINO_GIT_HOST_URL), e.g. https://gitlab.example.com
  gitHostUrl: https://gitlab.spice-platform.eu

# Change this if using external Database
database:
  enabled: true
  image: postgres:13
  name: postgres
  user: postgres
  password: postgres
  port: "5432"
