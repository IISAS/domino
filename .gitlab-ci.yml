# ── REST image ────────────────────────────────────────────────────────────────

rest-image-dev:
  extends: .docker_build
  stage: build-dev
  tags:
    - privileged
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes: [rest/**/*]
    - when: manual
      allow_failure: true
  script:
    - >
      docker buildx build --push
      --tag $REGISTRY_BASE/domino-rest:latest-dev
      --file rest/Dockerfile
      rest/

rest-image-prod:
  extends: .docker_build
  stage: build-prod
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [rest/**/*]
    - when: manual
      allow_failure: true
  script:
    - >
      docker buildx build --push
      --tag $REGISTRY_BASE/domino-rest:latest
      --file rest/Dockerfile
      rest/

# ── Frontend images ───────────────────────────────────────────────────────────

frontend-k8s-dev:
  extends: .docker_build
  stage: build-dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes: [frontend/**/*]
    - when: manual
      allow_failure: true
  script:
    - >
      docker buildx build --push
      --tag $REGISTRY_BASE/domino-frontend:k8s-dev
      --file frontend/Dockerfile.prod
      frontend/

frontend-compose-dev:
  extends: .docker_build
  stage: build-dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes: [frontend/**/*]
    - when: manual
      allow_failure: true
  script:
    - >
      docker buildx build --push
      --tag $REGISTRY_BASE/domino-frontend:dev-compose
      --build-arg DOMINO_DEPLOY_MODE=local-compose
      --file frontend/Dockerfile.prod
      frontend/

frontend-k8s-prod:
  extends: .docker_build
  stage: build-prod
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [frontend/**/*]
    - when: manual
      allow_failure: true
  script:
    - >
      docker buildx build --push
      --tag $REGISTRY_BASE/domino-frontend:k8s
      --file frontend/Dockerfile.prod
      frontend/

frontend-compose-prod:
  extends: .docker_build
  stage: build-prod
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [frontend/**/*]
    - when: manual
      allow_failure: true
  script:
    - >
      docker buildx build --push
      --tag $REGISTRY_BASE/domino-frontend:compose
      --build-arg DOMINO_DEPLOY_MODE=local-compose
      --file frontend/Dockerfile.prod
      frontend/

# ── Airflow / piece base images ───────────────────────────────────────────────

airflow-base-dev:
