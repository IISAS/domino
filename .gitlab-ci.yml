# GitLab CI/CD — converted from .github/workflows/
#
# Required CI/CD variables (Settings → CI/CD → Variables):
#   CONTAINER_REGISTRY           — registry host, e.g. "ghcr.io" or "registry.gitlab.example.com"
#   CONTAINER_REGISTRY_BASE_PATH — namespace/org path, e.g. "iisas" or "myorg/domino"
#   CONTAINER_REGISTRY_USERNAME  — username for registry login
#   CONTAINER_REGISTRY_PASSWORD  — token/password for registry login
#   TESTS_WORKFLOWS_REPOSITORY   — e.g. "myorg/domino_workflows_test"
#   TESTS_GIT_WORKFLOWS_TOKEN    — token for the test workflows repository
#   TESTS_GIT_PIECES_TOKEN       — token for the test pieces repository
#   CODECOV_TOKEN                — Codecov upload token
#   PYPI_TOKEN                   — PyPI API token (twine)
#
# The integration-tests job requires a privileged GitLab runner
# (tag it "privileged" or adjust the `tags:` key below).

stages:
  - test
  - build-dev
  - release
  - build-prod

# ── shared: Docker build template ────────────────────────────────────────────

.docker_build:
  image: docker:24
  services:
    - name: docker:24-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    # Derived convenience variable — override if needed
    REGISTRY_BASE: "$CONTAINER_REGISTRY/$CONTAINER_REGISTRY_BASE_PATH"
  before_script:
    - docker context create tls-env
    - docker buildx create --use --driver docker-container tls-env
    - docker login "$CONTAINER_REGISTRY" -u "$CONTAINER_REGISTRY_USERNAME" -p "$CONTAINER_REGISTRY_PASSWORD"

