      allow_failure: true
  script:
    - >
      docker buildx build --push
      --tag $REGISTRY_BASE/domino-shared-storage-sidecar:latest-dev
      --file src/domino/custom_operators/sidecar/Dockerfile
      src/domino/custom_operators/sidecar/

airflow-base-prod:
