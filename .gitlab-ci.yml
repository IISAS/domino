# ── Python package release ────────────────────────────────────────────────────

gitlab-release:
  stage: release
  image: python:3.11-slim
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [src/domino/**/*]
  before_script:
    - pip install -q tomli
  script:
    - PACKAGE_VERSION=$(python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['version'])")
    - echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> release.env
  artifacts:
    reports:
      dotenv: release.env

create-gitlab-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: gitlab-release
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [src/domino/**/*]
  script:
    - echo "Creating GitLab release v${PACKAGE_VERSION}"
  release:
    tag_name: "v${PACKAGE_VERSION}"
    name: "domino-py v${PACKAGE_VERSION}"
    description: "Release v${PACKAGE_VERSION}"
    ref: "$CI_COMMIT_SHA"

pypi-release:
  stage: release
  image: python:3.11-slim
  needs:
    - job: gitlab-release
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [src/domino/**/*]
  before_script:
    - pip install -q build twine
  script:
    - python -m build
    - twine upload dist/*
  variables:
    TWINE_USERNAME: __token__
    TWINE_PASSWORD: "$PYPI_TOKEN"

# ── Helm chart release ────────────────────────────────────────────────────────

helm-release:
  stage: release
  image: alpine/helm:3.14.0
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [helm/**/*]
  before_script:
    - helm registry login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_JOB_TOKEN"
  script:
    - helm package helm/domino
    - helm push domino-*.tgz "oci://${CI_REGISTRY}/${CI_PROJECT_PATH}/charts"
